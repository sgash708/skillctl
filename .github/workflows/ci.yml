name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go test with coverage
        run: go test ./... -coverprofile=coverage.out
      - name: octocov
        if: matrix.os == 'ubuntu-latest'
        uses: k1LoW/octocov-action@v1
      - name: smoke test
        shell: bash
        run: |
          go build -o skillctl ./cmd/skillctl
          ./skillctl --version
          mkdir -p smoke/foo
          printf -- '---\nname: foo\ndescription: demo\n---\n' > smoke/foo/SKILL.md
          ./skillctl generate --owner ci smoke
          ./skillctl generate --owner ci --check smoke
