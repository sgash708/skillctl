version: 2
project_name: skillctl
builds:
  - main: ./cmd/skillctl
    binary: skillctl
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Os }}_{{ .Arch }}
checksum:
  name_template: "checksums.txt"
release:
  github:
    owner: sgash708
    name: skillctl
